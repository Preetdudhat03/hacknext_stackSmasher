services:
  # Python Backend (FastAPI)
  - type: web
    name: swaascare-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend/app && uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

  # Next.js Frontend
  - type: web
    name: swaascare-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://swaascare-backend.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
